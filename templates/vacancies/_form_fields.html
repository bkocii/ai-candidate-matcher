{% if form.non_field_errors %}
    <div class="form-error">{{ form.non_field_errors }}</div>
{% endif %}

{% for field in form %}
    <div class="field">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}<small class="help-text">{{ field.help_text }}</small>{% endif %}
        {% if field.errors %}<div class="field-errors">{{ field.errors }}</div>{% endif %}
    </div>
{% endfor %}
