upstream ai_candidate_matcher {
    server unix:/run/ai-candidate-matcher/gunicorn.sock;
}

server {
    listen 80;
    server_name matcher.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name matcher.example.com;

    # Configure certificates with the deployment's approved TLS tooling.
    ssl_certificate /etc/letsencrypt/live/matcher.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matcher.example.com/privkey.pem;

    client_max_body_size 11m;

    location /static/ {
        alias /srv/ai-candidate-matcher/current/staticfiles/;
        access_log off;
        expires 1h;
    }

    # There is intentionally no /media/ location. Candidate documents are
    # private and are delivered only by the authorized Django attachment route.
    location / {
        proxy_pass http://ai_candidate_matcher;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 130s;
    }
}
